  border-top:1px solid #dce8dc20;background:#0c180e99;
  backdrop-filter:blur(5px);
}
.play{
  width:12%;aspect-ratio:1;border-radius:50%;border:0;
  background:#e9f1e8;color:#122016;display:grid;place-items:center;
  cursor:pointer;font-size:clamp(8px,1.6vw,17px);padding:0;
}
.info{min-width:0;flex:1}
.station{font-weight:600;font-size:clamp(7px,1vw,11px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:clamp(5px,.72vw,8px);opacity:.62;margin-top:2px}
.select{
  max-width:43%;background:#1c2c1d;color:#edf5ed;border:1px solid #dce8dc2b;
  border-radius:6px;padding:4px 5px;font-size:clamp(5px,.75vw,8px);outline:0;
}
#unlock{
  position:absolute;inset:0;z-index:10;background:#0b140ddd;display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:7px;text-align:center;padding:10%;
}
#unlock.hidden{display:none}
.unlockBtn{
  border:0;border-radius:999px;padding:8px 15px;background:#f2f6f0;color:#142016;
  font-weight:700;cursor:pointer;font-size:clamp(9px,1.3vw,13px)
}
.hint{font-size:clamp(5px,.8vw,8px);opacity:.65}
.footer{
  position:absolute;left:50%;bottom:2.2%;transform:translateX(-50%);
  font:500 clamp(7px,1vw,10px)/1 Inter,Arial,sans-serif;color:#fff9;z-index:3;
}
@media(max-aspect-ratio: 567/554){
 .room{width:100vw;height:100vh;aspect-ratio:auto}
}
</style>
</head>
<body>
<div class="scene">
  <div class="room">

    <div class="screen">
      <div class="topbar">
        <span><span class="dot"></span><span id="clock">--:--</span></span>
        <span id="day">Saturday</span>
        <span id="smallDate">05 Sep 2026</span>
      </div>

      <div class="main">
        <div class="month" id="month">May</div>
        <div class="date" id="date">05</div>
        <div class="meta">
          INDIA FM RADIO • LIVE STREAM<br>
          AUTO PLAY ENABLED • INDIAN MUSIC & RADIO<br>
          Select a station below to switch instantly.
        </div>
      </div>

      <div class="radio">
        <button class="play" id="play" aria-label="Play">▶</button>
        <div class="info">
          <div class="station" id="stationName">Radio Mirchi Hindi</div>
          <div class="status" id="status">Connecting to live radio…</div>
        </div>
        <select class="select" id="stations" aria-label="Indian FM station"></select>
      </div>

      <div id="unlock">
        <button class="unlockBtn" id="unlockBtn">▶ Start Radio</button>
        <div class="hint">Browsers may block sound autoplay until you interact once.</div>
      </div>
      <audio id="audio" preload="none" playsinline></audio>
    </div>

    <div class="footer"><strong>Designed by Bhim Mondal</strong></div>
  </div>
</div>

<script>
const stations = [
  {name:"Radio Mirchi Hindi", type:"audio", url:"https://eu8.fastcast4u.com/proxy/clyedupq/stream"},
  {name:"Red FM 93.5", type:"audio", url:"https://stream-174.zeno.fm/q97eczydqrhvv"},
  {name:"Mirchi Top 20", type:"audio", url:"https://drive.uber.radio/uber/bollywoodnow/icecast.audio"},
  {name:"Mirchi Love Hindi", type:"audio", url:"https://drive.uber.radio/uber/lrbollywood/icecast.audio"},
  {name:"ISHQ FM 104.8", type:"audio", url:"https://drive.uber.radio/uber/bollywoodlove/icecast.audio"},
  {name:"FM Rainbow", type:"hls", url:"https://air.pc.cdn.bitgravity.com/air/live/pbaudio004/chunklist.m3u8"},
  {name:"FM Gold", type:"hls", url:"https://air.pc.cdn.bitgravity.com/air/live/pbaudio005/chunklist.m3u8"},
  {name:"Vividh Bharati", type:"hls", url:"https://air.pc.cdn.bitgravity.com/air/live/pbaudio001/playlist.m3u8"},
  {name:"Radio Gaana", type:"audio", url:"https://sp14.instainternet.com/8044/stream"},
  {name:"Radio Udaan", type:"audio", url:"https://stream.radioudaan.com/listen/radio_udaan/radio.mp3"},
  {name:"Bombay Beats Radio", type:"audio", url:"https://strmreg.1.fm/bombaybeats_mobile_mp3"},
  {name:"Hindi Gold Radio", type:"audio", url:"https://azuracast.vibesounds.in:8010/radio.mp3"}
];

const audio = document.getElementById("audio");
const select = document.getElementById("stations");
const playBtn = document.getElementById("play");
const statusEl = document.getElementById("status");
const stationEl = document.getElementById("stationName");
const unlock = document.getElementById("unlock");
const unlockBtn = document.getElementById("unlockBtn");
let hls = null;
let current = 0;

stations.forEach((s,i)=>{
  const o=document.createElement("option");
  o.value=i;o.textContent=s.name;
  select.appendChild(o);
});

function setStatus(t){statusEl.textContent=t}
function cleanupHls(){
  if(hls){hls.destroy();hls=null}
}
function loadStation(index, autoplay=true){
  current=index;
  const s=stations[index];
  stationEl.textContent=s.name;
  select.value=index;
  cleanupHls();
  audio.pause();
  audio.removeAttribute("src");
  audio.load();
  setStatus("Connecting to live radio…");
  if(s.type==="hls"){
    if(window.Hls && Hls.isSupported()){
      hls=new Hls({enableWorker:true,maxBufferLength:12});
      hls.loadSource(s.url);
      hls.attachMedia(audio);
      hls.on(Hls.Events.MANIFEST_PARSED,()=>autoplayNow(autoplay));
      hls.on(Hls.Events.ERROR,(e,d)=>{
        if(d.fatal){setStatus("Stream unavailable — try another station");}
      });
    }else if(audio.canPlayType("application/vnd.apple.mpegurl")){
      audio.src=s.url;
      audio.addEventListener("loadedmetadata",()=>autoplayNow(autoplay),{once:true});
    }else{
      setStatus("HLS not supported in this browser");
    }
  }else{
    audio.src=s.url;
    autoplayNow(autoplay);
  }
}
function autoplayNow(should){
  if(!should)return;
  audio.play().then(()=>{
    unlock.classList.add("hidden");
    playBtn.textContent="❚❚";
    setStatus("LIVE • " + stations[current].name);
  }).catch(()=>{
    unlock.classList.remove("hidden");
    playBtn.textContent="▶";
    setStatus("Tap Start Radio to begin");
  });
}
playBtn.addEventListener("click",()=>{
  if(audio.paused){
    audio.play().then(()=>{
      unlock.classList.add("hidden");
      playBtn.textContent="❚❚";
      setStatus("LIVE • " + stations[current].name);
    }).catch(()=>{});
  }else{
    audio.pause();playBtn.textContent="▶";setStatus("Paused");
  }
});
unlockBtn.addEventListener("click",()=>{
  unlock.classList.add("hidden");
  loadStation(current,true);
});
select.addEventListener("change",e=>loadStation(Number(e.target.value),true));
audio.addEventListener("playing",()=>{
  unlock.classList.add("hidden");
  playBtn.textContent="❚❚";
  setStatus("LIVE • " + stations[current].name);
});
audio.addEventListener("pause",()=>playBtn.textContent="▶");
audio.addEventListener("error",()=>setStatus("Could not play this stream — choose another station"));

function tick(){
  const d=new Date();
  document.getElementById("clock").textContent=d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("day").textContent=d.toLocaleDateString("en-IN",{weekday:"long"});
  document.getElementById("smallDate").textContent=d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
  document.getElementById("month").textContent=d.toLocaleDateString("en-IN",{month:"long"});
  document.getElementById("date").textContent=String(d.getDate()).padStart(2,"0");
}
tick();setInterval(tick,1000);

// Automatically select and attempt the first Indian station.
loadStation(0,true);
</script>
</body>
</html>
